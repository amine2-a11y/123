<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d0b">
<title>Amine PS4 • Zombie Stability</title>
<style>
:root{--bg:#090b09;--panel:rgba(10,14,11,.90);--line:rgba(191,224,174,.25);--text:#eef2eb;--muted:#b0b6ad;--accent:#c9f36b;--accent2:#91b94d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font:15px/1.45 Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh;padding:14px;background:linear-gradient(110deg,rgba(3,5,4,.78),rgba(3,5,4,.43)),url("zombie-bg.jpeg") center/cover fixed}
.wrap{width:min(100%,650px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:rgba(9,13,10,.90)}
.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}.chip{font-size:12px;color:var(--accent);border:1px solid #2b665f;border-radius:99px;padding:5px 9px;white-space:nowrap}
.card{margin-top:14px;padding:clamp(22px,5vw,36px);border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(16,22,16,.93),rgba(7,10,8,.91) 68%);box-shadow:0 18px 40px #0008;backdrop-filter:blur(3px)}
.mark{width:42px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--accent),#748f3f);margin-bottom:20px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.08;letter-spacing:-.04em;margin:0}h1 span{color:var(--accent)}
p{color:var(--muted);margin:12px 0 0}.status{display:flex;align-items:center;gap:11px;border:1px solid var(--line);background:rgba(6,10,7,.78);border-radius:10px;padding:13px 14px;margin-top:24px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px #43e0c177;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.meta span{font-size:12px;color:#b5c6d3;border:1px solid var(--line);padding:6px 9px;border-radius:7px}
.foot{font-size:11px;color:#65798a;text-align:center;margin-top:15px}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">AMINE <span>PS4</span></div><div class="chip">STABILITY • AUTO</div></header>
<section class="card">
<div class="mark"></div>
<h1>Smart <span>Host</span></h1>
<p>واجهة Zombie بالصورة اللي اخترتها، مع توجيه تلقائي ومحاولة تجهيز الكاش المحلي.</p>
<div class="status"><i class="dot"></i><div><strong id="state">Detecting firmware…</strong><br><span id="detail">Please wait; this page will continue in the same tab.</span></div></div>
<div class="meta"><span>LIGHT UI</span><span>SINGLE TAB</span><span>GOLDHEN LATEST</span></div>
</section>
<footer class="foot">Amine PS4 • Local firmware routing</footer>
</main>
<script>
(function(){
  var ua=navigator.userAgent||"";
  var m=ua.match(/PlayStation\s*4[\/ ]([0-9]+(?:\.[0-9]+)?)/i);
  if(!m){m=ua.match(/([0-9]{1,2}\.[0-9]{2})(?=\)\s*AppleWebKit)/i);}
  var fw=m?m[1]:"";
  var n=parseFloat(fw);
  var target="";
  if(fw==="5.05") target="505/index.html";
  else if(fw==="6.72") target="672/index.html";
  else if(n>=7.00&&n<=8.52) target="700/cache.html";
  else if(n>=9.00&&n<=9.60) target="900/cache.html";
  else if(n>=6.00&&n<7.00) target="css/latest/index.html";
  else if(n>=9.61&&n<=10.71) target="css/latest/index.html";
  else if(n>=11.00&&n<=13.00) target="1300/index.html";
  else if(n>=13.02&&n<=13.52) target="1352/index.html";
  var state=document.getElementById("state"),detail=document.getElementById("detail");
  if(!target){state.textContent="Firmware not recognized";detail.textContent="Detected: "+(fw||"unknown")+". Open the host that matches your firmware.";return;}
  state.textContent="Firmware "+fw+" detected";
  detail.textContent="Preparing matching host and cache…";
  window.setTimeout(function(){window.location.replace(target);},650);
}());
</script>
</body>
</html>
