<!DOCTYPE html>
<html lang="en" manifest="PSPulse.cache">

<head>
    <link rel="icon" type="image/png" href="../ps.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMINE PS4 // PS4 7.00-8.52 HOST / CACHE</title>
    <script>history.replaceState(null, null, 'index.html');</script>
    <style>
        :root {
            --bg: #151515;
            --panel: #1c1c1c;
            --panel-2: #242424;
            --line: #2e2e2e;
            --line-bright: #454545;
            --text: #f5f5f5;
            --muted: #b5b5b5;
            --dim: #828282;
            --accent: #a294ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg); }
        html, body { min-height: 100%; }
        body {
            background-color: var(--bg);
            background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--text);
            display: flex;
            flex-direction: column;
            font: 17px/1.4 Consolas, "Liberation Mono", monospace;
            min-height: 100vh;
            overflow: hidden;
        }
        a { color: inherit; }

        .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 920px); }

        /* Top status bar */
        .bar {
            align-items: center;
            border: 1px solid var(--line-bright);
            display: flex;
            font-size: 14px;
            justify-content: space-between;
            letter-spacing: .1em;
            padding: 10px 16px;
            text-transform: uppercase;
        }
        .bar b { color: var(--accent); font-weight: 400; }
        .bar-fw { color: var(--dim); }
        .bar-fw::before { color: var(--accent); content: "\25CF "; }

        .layout { display: flex; flex: 1 0 auto; flex-direction: column; justify-content: center; padding: 20px 0 0; }

        .kicker { color: var(--accent); font-size: 14px; letter-spacing: .14em; margin: 0 0 12px; }
        h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 400; letter-spacing: -.07em; line-height: 1; margin: 0; }
        h1 em { color: var(--accent); font-style: normal; }
        .sub { color: var(--muted); font-size: 17px; margin: 13px 0 0; }
        .boot { color: var(--dim); font-size: 14px; list-style: none; margin: 12px 0 0; }
        .boot li { margin: 3px 0; }
        .boot b { color: var(--accent); font-weight: 400; }

        .progress-container { margin-top: 20px; width: 100%; }
        .progress-label { color: var(--accent); font-size: 15px; margin-bottom: 10px; }
        .progress-wrapper { background: var(--panel); border: 1px solid var(--line-bright); padding: 6px; }
        .progress-bar { background: var(--panel-2); border: 1px solid var(--line); height: 62px; overflow: hidden; position: relative; }
        .progress-fill { background: var(--accent); height: 100%; width: 0; }
        .progress-text { color: var(--text); font-size: 20px; font-weight: 400; left: 50%; position: absolute; text-shadow: 0 1px 8px rgba(0, 0, 0, .8); top: 50%; transform: translate(-50%, -50%); z-index: 3; }
        .status-message { color: var(--muted); font-size: 15px; margin-top: 12px; }

        .foot {
            border-top: 1px solid var(--line);
            color: var(--dim);
            font-size: 13px;
            margin-top: 16px;
            padding: 12px 4px 2px;
            text-align: center;
        }
        .foot a { color: var(--muted); }
        .foot a:hover, .foot a:focus { color: var(--accent); }

        @media (max-width: 700px) {
            body { overflow: auto; }
            .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
            .bar { font-size: 12px; padding: 8px 12px; }
            .layout { padding-top: 14px; }
            h1 { font-size: 40px; }
            .progress-bar { height: 56px; }
        }
    </style>

<style id="amine-ps4-theme">
:root{--bg:#0b1118;--panel:#121d28;--panel-2:#182938;--line:#243545;--line-bright:#315064;--text:#eaf2f8;--muted:#9db1c0;--dim:#718899;--accent:#43e0c1;--red:#ff8585;--amber:#f0c779}
html{background:var(--bg)!important}
body{font-family:Arial,Helvetica,sans-serif!important;background-color:var(--bg)!important;background-image:radial-gradient(ellipse at 50% 0%,#142c37 0%,var(--bg) 65%)!important;background-size:auto!important;color:var(--text)!important}
.app{width:min(100% - 24px,920px)!important;padding:12px 0!important}
.bar,.status,.controls,.nodeplay,.row,.card,.progress-wrapper{border-radius:10px!important}
.bar{background:#0f1822!important;border-color:var(--line)!important;letter-spacing:.04em!important}
.bar b,h1 em,.kicker,.bar-fw:before,.boot b,.progress-label{color:var(--accent)!important}
h1{font-family:Arial,Helvetica,sans-serif!important;font-weight:750!important;letter-spacing:-.045em!important}
.sub{font:15px/1.5 Arial,Helvetica,sans-serif!important;color:var(--muted)!important}
.status,.controls,.nodeplay,.row,.card{background:rgba(18,29,40,.94)!important;border-color:var(--line)!important}
.notification,.notification2,.progress-bar{background:#0d1720!important;border-color:var(--line)!important;border-radius:8px!important}
button,.grid button{border-radius:8px!important;background:#142330!important;border-color:var(--line-bright)!important;color:var(--text)!important;font-family:Arial,Helvetica,sans-serif!important}
button:hover,button:focus,.grid button:hover,.grid button:focus{border-color:var(--accent)!important;color:var(--accent)!important}
.foot{font:11px/1.5 Arial,Helvetica,sans-serif!important;color:var(--dim)!important;border-color:var(--line)!important}
@media(max-width:820px){.app{width:min(100% - 20px,600px)!important;padding:8px 0!important}h1{font-size:36px!important}}
</style>

</head>

<body>
    <div class="app">
        <header class="bar">
            <span><b>AMINE PS4</b> // ps4 hosts</span>
            <span class="bar-fw">cache update</span>
        </header>

        <main class="layout">
            <p class="kicker">$ ./cache --install</p>
            <h1>Loading <em>offline cache</em></h1>
            <ul class="boot">
                <li>[ <b>ok</b> ] psfree 1.7 chain ready</li>
                <li>[ <b>..</b> ] downloading host files</li>
            </ul>

            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper">
                    <div class="progress-bar" id="myProgress">
                        <div class="progress-fill" id="myBar"></div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>
                </div>
                <div class="status-message">Initializing cache system...</div>
            </section>
        </main>

        <footer class="foot">
            Author: <a href="https://t.me/sudoBlackArch">BlackArch</a> // Telegram: <a href="https://t.me/PlayStation_Pulse">PlayStation Pulse</a>
        </footer>
    </div>

    <script>
        (function () {
            var appCache = window.applicationCache;
            var progressLabel = document.getElementById('progress');
            var progressBar = document.getElementById('myBar');
            var progressText = document.getElementById('progressText');
            var redirectPending = false;

            function setCached(value) {
                try { localStorage.is755BCached = value ? 'true' : 'false'; } catch (error) {}
            }
            function setProgress(value) {
                var progress = Math.max(0, Math.min(100, value));
                progressBar.style.width = progress + '%';
                progressText.innerHTML = progress + '%';
            }
            function openHost(message) {
                if (redirectPending) return;
                redirectPending = true;
                setCached(true);
                setProgress(100);
                progressLabel.innerHTML = message;
                setTimeout(function () { window.location.replace('index.html'); }, 1200);
            }
            if (!appCache) {
                progressLabel.innerHTML = 'Offline cache is not supported by this browser.';
                return;
            }
            if (appCache.status === appCache.DOWNLOADING) setCached(false);
            appCache.ondownloading = function () {
                setCached(false);
                progressLabel.innerHTML = 'Page Caching Started!!';
            };
            appCache.onprogress = function (event) {
                if (event.lengthComputable && event.total > 0)
                    setProgress(Math.round(100 * event.loaded / event.total));
            };
            appCache.oncached = function () { openHost('Page Cached Successfully!!!'); };
            appCache.onupdateready = function () {
                try { appCache.swapCache(); } catch (error) {}
                openHost('Cache Updated Successfully!!!');
            };
            appCache.onnoupdate = function () { openHost('Offline Cache Ready'); };
            appCache.onerror = function () {
                setCached(false);
                progressLabel.innerHTML = 'Offline cache failed. Clear browser data and reload while online.';
            };
            appCache.onobsolete = appCache.onerror;
        }());
    </script>


</body>

</html>
