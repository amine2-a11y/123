<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
    <link rel="icon" type="image/png" href="../pspulse.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSPULSE // 11.00-13.00 POOPS</title>
<style>
    :root {
        --bg: #151515;
        --panel: #1c1c1c;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #a294ff;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        font: 16px/1.45 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow: hidden;
    }

    .app { margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Top status bar */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-chain { color: var(--dim); }
    .bar-chain::before { color: var(--accent); content: "\25CF "; }

    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 18px 0 10px; }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }

    /* chain JS scrolls this element - keep overflow and a fixed height */
    #out {
        background: var(--panel);
        border: 1px solid var(--line-bright);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        height: calc(100vh - 150px);
        overflow-y: auto;
        padding: 12px 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 760px) {
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        #state { font-size: 19px; margin: 14px 0 8px; }
        #out { height: calc(100vh - 120px); font-size: 12px; }
    }
</style>

<style id="amine-zombie-pro-theme-v3">
:root { --amine-toxic:#b9f36b; --amine-blood:#b83c42; --amine-glass:rgba(7,12,10,.76); }
html { background:#080b09 !important; }
body { background-color:#080b09 !important; background-image:linear-gradient(180deg,rgba(3,6,5,.64),rgba(3,6,5,.78)),url("../zombie-bg.jpeg") !important; background-position:center center !important; background-size:cover !important; background-repeat:no-repeat !important; background-attachment:fixed !important; color:#f0f4ed !important; }
/* Consistent survival-horror palette across every firmware page */
.app { position:relative; z-index:1; }
.bar, .status, .status-meta, .section-title, .panel, .card, .cache-panel, .progress-wrapper, .progress-container { background-color:rgba(7,12,10,.62) !important; border-color:rgba(185,243,107,.38) !important; box-shadow:0 8px 28px rgba(0,0,0,.20); }
h1 em, .kicker, .bar b, .bar-fw::before, .bar-ready::before, .boot b, .section-title, .progress-label, .progress-text { color:var(--amine-toxic) !important; }
button, .button, input[type=button], input[type=submit] { border-color:rgba(185,243,107,.62) !important; }
button:hover, .button:hover, input[type=button]:hover, input[type=submit]:hover { background-color:rgba(185,243,107,.16) !important; }
.progress-fill, #myBar { background:linear-gradient(90deg,#6b9d32,#d7f57a) !important; }
/* Center footer/support icons on cache screens without changing their actions */
.pspulse-support, .support, .footer-icons, .social-links { display:flex; justify-content:center; align-items:center; gap:14px; margin-left:auto; margin-right:auto; }
footer { text-align:center; }
@media (max-width:700px) { .app { width:100% !important; padding:12px 14px !important; } h1 { letter-spacing:-.035em !important; } }
</style>
<style id="amine-apocalypse-pro">

/* AMINE PS4 // APOCALYPSE PRO — visual layer only */
:root {
 --ap-green:#c9f36b; --ap-green2:#8dbb3f; --ap-red:#ef5b55;
 --ap-white:#f4f5ef; --ap-muted:#c2c9bf; --ap-glass:rgba(9,15,13,.78);
 --ap-border:rgba(201,243,107,.42); --ap-shadow:0 18px 48px rgba(0,0,0,.42);
}
html { background:#080b09 !important; min-height:100%; }
body { position:relative; isolation:isolate; min-height:100vh !important; overflow-x:hidden !important;
 background:transparent !important; color:var(--ap-white) !important;
 font-family:Arial,Helvetica,sans-serif !important; line-height:1.48 !important; }
body::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
 background-image:linear-gradient(90deg,rgba(3,7,6,.70),rgba(4,9,7,.47) 48%,rgba(3,7,6,.72)),
 linear-gradient(0deg,rgba(2,5,4,.70),rgba(2,5,4,.20) 45%,rgba(2,5,4,.38)),
 url("../zombie-bg.jpeg"); background-size:cover,cover,cover; background-position:center,center,center;
 background-repeat:no-repeat; transform:translateZ(0); }
body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.18;
 background:radial-gradient(ellipse at 50% 42%,transparent 0%,rgba(0,0,0,.62) 100%); }
* { box-sizing:border-box; }
a { color:var(--ap-green) !important; text-decoration:none; }
a:hover { color:#fff !important; }
.app { width:min(100% - 36px,1060px) !important; max-width:1060px !important; min-height:100vh !important;
 margin:0 auto !important; padding:22px 0 24px !important; gap:18px !important; }
.bar { min-height:52px; padding:12px 18px !important; gap:12px; flex-wrap:wrap;
 background:rgba(5,10,8,.72) !important; border:1px solid var(--ap-border) !important;
 border-radius:14px !important; box-shadow:var(--ap-shadow); backdrop-filter:blur(5px);
 color:var(--ap-white) !important; letter-spacing:.08em !important; font-size:13px !important; }
.bar b,.kicker,.boot b,.section-title,.bar-fw,.fw-display,.menu-title { color:var(--ap-green) !important; }
.layout { width:100%; max-width:900px; margin:clamp(10px,4vh,42px) auto 0 !important;
 padding:clamp(20px,4vw,42px) !important; border:1px solid rgba(201,243,107,.25) !important;
 border-radius:22px !important; background:linear-gradient(135deg,rgba(7,13,10,.87),rgba(10,17,13,.74)) !important;
 box-shadow:var(--ap-shadow); backdrop-filter:blur(6px); }
h1 { color:#f8f9f2 !important; font-family:Arial,Helvetica,sans-serif !important;
 font-size:clamp(28px,4.2vw,48px) !important; line-height:1.08 !important; letter-spacing:-.035em !important;
 margin:8px 0 14px !important; text-shadow:0 3px 18px rgba(0,0,0,.55); }
h1 em { color:var(--ap-green) !important; font-style:normal !important; }
.sub { color:#d5dbd2 !important; max-width:760px; font-size:15px !important; }
.kicker { font-size:11px !important; font-weight:700; letter-spacing:.18em !important; text-transform:uppercase; }
.boot { padding:12px 16px !important; margin:18px 0 !important; border:1px solid rgba(201,243,107,.19) !important;
 border-radius:12px !important; background:rgba(0,0,0,.23) !important; color:#d6ddd3 !important; }
.boot li { margin:3px 0; }
.status,.jailbreak-status,.status-message,.progress-container,.menu,.version-card,.card-action,.status-meta,
.grid-goldhen,.controls,.chain-options { border:1px solid rgba(201,243,107,.26) !important; border-radius:14px !important;
 background:rgba(5,11,8,.76) !important; box-shadow:0 8px 25px rgba(0,0,0,.2); }
.status,.progress-container,.controls,.menu { padding:16px !important; }
.status-meta { display:flex; flex-wrap:wrap; gap:10px 18px; padding:10px 12px !important; margin-top:10px !important; }
.status-pass { color:var(--ap-green) !important; }
.status-fail,.status-fail * { color:#ff8d83 !important; }
button,.go,.menu a,.version-card,.card-action,.chain-option { transition:background .15s,border-color .15s,transform .15s; }
button,.go,.menu a,.card-action { min-height:42px; border:1px solid rgba(201,243,107,.56) !important;
 border-radius:10px !important; background:linear-gradient(135deg,rgba(34,55,28,.96),rgba(14,28,19,.96)) !important;
 color:#f7f9ef !important; font-weight:700 !important; padding:11px 16px !important; box-shadow:0 5px 16px rgba(0,0,0,.22); }
button:hover,.go:hover,.menu a:hover,.card-action:hover { background:linear-gradient(135deg,#425d2a,#182d1d) !important; border-color:var(--ap-green) !important; }
button:focus,.go:focus,a:focus { outline:2px solid var(--ap-green) !important; outline-offset:3px; }
.grid,.version-grid { gap:12px !important; }
.section-title { font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:12px !important; }
.fw-display { border:1px solid var(--ap-border) !important; border-radius:10px !important; background:rgba(21,39,22,.78) !important;
 padding:10px 14px !important; }
.foot { margin:14px auto 0 !important; text-align:center !important; color:#c5cdc2 !important; font-size:11px !important; opacity:.9; }
.nodeplay,.np-open { border-radius:12px !important; background:rgba(5,10,8,.78) !important; border-color:rgba(201,243,107,.28) !important; }
input,select { background:rgba(4,9,7,.9) !important; color:#fff !important; border:1px solid rgba(201,243,107,.4) !important; border-radius:8px !important; }
.progress-wrapper { padding:5px !important; border-radius:12px !important; background:rgba(0,0,0,.5) !important; border:1px solid rgba(201,243,107,.45) !important; }
.progress-bar { min-height:28px; border-radius:8px !important; background:rgba(255,255,255,.07) !important; overflow:hidden; }
.progress-fill { background:linear-gradient(90deg,#638d32,#c9f36b) !important; border-radius:7px !important; }
.progress-text { color:#10170b !important; font-weight:800 !important; text-shadow:none !important; }
/* centered compact emblem row, especially visible beneath cache progress */
.ap-emblems { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:12px; margin:18px auto 2px; }
.ap-emblems span { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-width:112px; padding:8px 13px;
 border:1px solid rgba(201,243,107,.32); border-radius:999px; background:rgba(4,9,7,.72); color:#eaf3df;
 font-size:11px; font-weight:700; letter-spacing:.08em; }
.ap-emblems i { width:7px; height:7px; display:inline-block; border-radius:50%; background:var(--ap-green); box-shadow:0 0 10px rgba(201,243,107,.65); }
/* avoid tiny content being vertically centered or clipped by old layout rules */
@media (max-width:700px) { .app { width:calc(100% - 24px) !important; padding-top:12px !important; }
 .layout { padding:18px !important; margin-top:6px !important; } .bar { font-size:11px !important; }
 button,.go,.menu a,.card-action { width:100%; } .ap-emblems span { min-width:100px; } }

</style>
</head>
<body>
    <div class="app">
        <header class="bar">
            <span><b>AMINE PS4</b> // SURVIVAL HOST</span>
            <span class="bar-chain">poops chain</span>
        </header>

        <div id="state">loading poops chain...</div>
        <div id="out"></div>
    </div>
<script type="module">import "./chain_poops.js";</script>
<script>
// PSPULSE: auto-reload DISABLED for poops (12.50/12.52/13.00).
// The attempt-ceiling monitor was removed here because its trigger
// (primitive "attempt-ceiling" in the log + FAILED state) persists in the
// visible log after the kernel has been touched (DOUBLE/TRIPLE-FREE).
// Reloading at that point re-enters on a dirty kernel without a reboot,
// which is a kernel-panic shape. Upstream (rawgame4 README) does manual
// reload only: a failed poops attempt means reboot, then retry.
// run_lapse.html keeps its own monitor; this file intentionally has none.
</script></body>
</html>
