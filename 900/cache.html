<!DOCTYPE html>
<html lang="en" manifest="PSPulse.manifest">
<head>
    <link rel="icon" type="image/png" href="../pspulse.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine PS4 • Offline Cache</title>
    <script>history.replaceState(null, null, 'index.html');</script>
    <style>
        :root { --bg:#151515; --panel:#1c1c1c; --panel-2:#242424; --line:#2e2e2e; --line-bright:#454545; --text:#f5f5f5; --muted:#b5b5b5; --dim:#828282; --accent:#a294ff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { background:var(--bg); }
        html, body { min-height:100%; }
        body { background-color:var(--bg); background-image:linear-gradient(rgba(162,148,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(162,148,255,.05) 1px,transparent 1px); background-size:36px 36px; color:var(--text); display:flex; flex-direction:column; font:17px/1.4 Consolas,"Liberation Mono",monospace; min-height:100vh; overflow:hidden; }
        a { color:inherit; }
        .app { display:flex; flex:1 0 auto; flex-direction:column; margin:0 auto; padding:14px 26px 12px; width:min(100% - 52px,920px); }
        .bar { align-items:center; border:1px solid var(--line-bright); display:flex; font-size:14px; justify-content:space-between; letter-spacing:.1em; padding:10px 16px; text-transform:uppercase; }
        .bar b { color:var(--accent); font-weight:400; }
        .bar-fw { color:var(--dim); }
        .bar-fw::before { color:var(--accent); content:"\25CF "; }
        .layout { display:flex; flex:1 0 auto; flex-direction:column; justify-content:center; padding:20px 0 0; }
        .kicker { color:var(--accent); font-size:14px; letter-spacing:.14em; margin:0 0 12px; }
        h1 { font-size:clamp(32px,5vw,52px); font-weight:400; letter-spacing:-.07em; line-height:1; margin:0; }
        h1 em { color:var(--accent); font-style:normal; }
        .boot { color:var(--dim); font-size:14px; list-style:none; margin:12px 0 0; }
        .boot li { margin:3px 0; }
        .boot b { color:var(--accent); font-weight:400; }
        .progress-container { margin-top:20px; width:100%; }
        .progress-label { color:var(--accent); font-size:15px; margin-bottom:10px; }
        .progress-wrapper { background:var(--panel); border:1px solid var(--line-bright); padding:6px; }
        .progress-bar { background:var(--panel-2); border:1px solid var(--line); height:62px; overflow:hidden; position:relative; }
        .progress-fill { background:var(--accent); height:100%; width:0; }
        .progress-text { color:var(--text); font-size:20px; font-weight:400; left:50%; position:absolute; text-shadow:0 1px 8px rgba(0,0,0,.8); top:50%; transform:translate(-50%,-50%); z-index:3; }
        .status-message { color:var(--muted); font-size:15px; margin-top:12px; }
        .foot { border-top:1px solid var(--line); color:var(--dim); font-size:13px; margin-top:16px; padding:12px 4px 2px; text-align:center; }
        .foot a { color:var(--muted); }
        .foot a:hover, .foot a:focus { color:var(--accent); }
        @media (max-width:700px) { body { overflow:auto; } .app { padding:8px 10px; width:min(100% - 20px,560px); } .bar { font-size:12px; padding:8px 12px; } .layout { padding-top:14px; } h1 { font-size:40px; } .progress-bar { height:56px; } }

        :root{--bg:#0b1118;--panel:#121d28;--panel-2:#182938;--line:#243545;--line-bright:#315064;--text:#eaf2f8;--muted:#9db1c0;--dim:#718899;--accent:#43e0c1}
        html{background:var(--bg)}
        body{font:15px/1.45 Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 0%,#142c37 0%,var(--bg) 65%);background-attachment:fixed}
        .app{width:min(100% - 24px,760px);padding:12px 0}
        .bar{border-radius:10px;background:#0f1822;border-color:var(--line);padding:12px 15px;letter-spacing:.05em}
        .bar b{color:var(--accent);font-weight:800}
        .layout{padding-top:clamp(26px,7vh,65px)}
        .kicker{font-size:12px;letter-spacing:.16em;color:var(--accent)}
        h1{font:750 clamp(30px,5vw,44px)/1.08 Arial,Helvetica,sans-serif;letter-spacing:-.04em}
        h1 em{color:var(--accent)}
        .boot{font-size:12px}
        .progress-label{color:var(--accent);font-size:13px}
        .progress-wrapper{background:#0d1720;border:1px solid var(--line);border-radius:10px;padding:5px}
        .progress-bar{height:44px;background:#101b25;border:1px solid var(--line);border-radius:7px}
        .progress-fill{background:linear-gradient(90deg,#2ebda6,#4da8ff);border:0;border-radius:5px;transition:width .15s linear}
        .progress-text{font:700 16px Arial,Helvetica,sans-serif}
        .status-message{font-size:13px}
        .foot{border-color:var(--line);font:11px Arial,Helvetica,sans-serif}

    </style>
</head>
<body>
    <div class="app">
        <header class="bar"><span><b>AMINE PS4</b> // AUTO HOST</span><span class="bar-fw">OFFLINE CACHE</span></header>
        <main class="layout">
            <p class="kicker">SYSTEM CHECK</p>
            <h1>Preparing <em>your host</em></h1>
            <ul class="boot"><li>[ <b>01</b> ] Detect firmware-specific files</li><li>[ <b>02</b> ] Save cache for offline use</li></ul>
            <section class="progress-container">
                <div class="progress-label" id="progress">Loading.. Please Wait !!!</div>
                <div class="progress-wrapper"><div class="progress-bar" id="myProgress"><div class="progress-fill" id="myBar"></div><div class="progress-text" id="progressText">0%</div></div></div>
                <div class="status-message" id="cacheStatus" role="status" aria-live="polite">Initializing cache system...</div><button id="retryCache" type="button" hidden style="margin-top:12px;padding:10px 14px;border:1px solid #315064;border-radius:8px;background:#121d28;color:#43e0c1;font:inherit" onclick="location.reload()">Retry cache</button>
            </section>
        </main>
        <footer class="foot">Amine PS4 • GoldHEN latest • Same-tab navigation</footer>
    </div>
    <script>
        (function () {
            'use strict';
            var appCache = window.applicationCache;
            var progressLabel = document.getElementById('progress');
            var progressBar = document.getElementById('myBar');
            var progressText = document.getElementById('progressText');
            var cacheStatus = document.getElementById('cacheStatus');
            var retryButton = document.getElementById('retryCache');
            var redirectPending = false;
            var failureTimer = null;

            function setCached(value) {
                try { localStorage.setItem('is900Cached', value ? 'true' : 'false'); } catch (e) {}
            }
            function setProgress(value) {
                var progress = Math.max(0, Math.min(100, value));
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';
            }
            function setMessage(title, detail, failed) {
                progressLabel.textContent = title;
                cacheStatus.textContent = detail;
                retryButton.hidden = !failed;
            }
            function openHost(message) {
                if (redirectPending) return;
                redirectPending = true;
                if (failureTimer) clearTimeout(failureTimer);
                setCached(true);
                setProgress(100);
                setMessage(message, 'Opening the host in this tab…', false);
                window.setTimeout(function () { window.location.replace('index.html'); }, 900);
            }
            function cacheFailure(detail) {
                if (failureTimer) clearTimeout(failureTimer);
                setCached(false);
                setMessage('Cache was not confirmed', detail, true);
            }
            if (!appCache) {
                cacheFailure('This PS4 browser does not expose the offline cache API. Stay online and use a supported host setup.');
                return;
            }
            appCache.ondownloading = function () {
                setCached(false);
                setMessage('Installing offline cache…', 'Keep this tab open until the download finishes.', false);
                setProgress(0);
            };
            appCache.onprogress = function (event) {
                if (event && event.lengthComputable && event.total > 0) setProgress(Math.round(100 * event.loaded / event.total));
                else cacheStatus.textContent = 'Downloading required host files…';
            };
            appCache.oncached = function () { openHost('Cache installed successfully'); };
            appCache.onupdateready = function () {
                try { appCache.swapCache(); } catch (e) {}
                openHost('Cache updated successfully');
            };
            appCache.onnoupdate = function () {
                var ready = appCache.status === appCache.IDLE || appCache.status === appCache.UPDATEREADY || appCache.status === appCache.CACHED;
                if (ready) openHost('Offline cache is up to date');
                else cacheFailure('The browser did not confirm a usable cache. Check the connection and retry.');
            };
            appCache.onerror = function () { cacheFailure('Download failed. Check the internet connection, then retry this page.'); };
            appCache.onobsolete = function () { cacheFailure('The cache manifest is obsolete on this host. Refresh the hosted files and retry.'); };
            if (appCache.status === appCache.CACHED || appCache.status === appCache.IDLE) {
                // A cached page can open without firing a new download event.
                window.setTimeout(function () {
                    if (!redirectPending && appCache.status === appCache.IDLE) openHost('Offline cache is ready');
                }, 700);
            }
            failureTimer = window.setTimeout(function () {
                if (!redirectPending) cacheFailure('No cache completion signal was received. Stay online and retry.');
            }, 45000);
        }());
    </script>
    
</body>
</html>
